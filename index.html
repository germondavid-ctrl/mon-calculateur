<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur Masloulim - David Germon</title>
    <style>
        :root { --primary: #1a365d; --secondary: #2b6cb0; --accent: #38a169; --bg: #f7fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #2d3748; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
        .card { border: 1px solid #e2e8f0; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        .result-box { background: #ebf8ff; padding: 20px; border-radius: 15px; text-align: center; }
        .price-tag { font-size: 28px; font-weight: bold; color: #e53e3e; }
        .formula-info { background: #fffaf0; border-right: 5px solid #ed8936; padding: 15px; margin-top: 15px; border-radius: 8px; }
        .rtl .formula-info { border-right: 5px solid #ed8936; border-left: none; }
        .ltr .formula-info { border-left: 5px solid #ed8936; border-right: none; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; }
        .rtl { direction: rtl; text-align: right; }
        .ltr { direction: ltr; text-align: left; }
    </style>
</head>
<body class="rtl" dir="rtl">

<div class="container" id="app">
    <div class="header">
        <h1 id="txtTitle">Simulateur de Formules (Masloulim)</h1>
        <button onclick="toggleLang()" id="btnLang">Français</button>
    </div>

    <div class="card">
        <label id="lblLoan">Montant du prêt souhaité (₪)</label>
        <input type="number" id="loanAmount" value="1000000" oninput="calculate()">
        
        <label id="lblYears">Durée du prêt (Années)</label>
        <input type="number" id="years" value="20" oninput="calculate()">

        <label id="lblFormula">Choisir la formule de crédit (Masloul) :</label>
        <select id="formulaSelect" onchange="calculate()">
            <option value="prime">Taux Prime (Variable - non indexé)</option>
            <option value="kalatz">Taux Fixe (Non indexé - Kalatz)</option>
            <option value="variable5">Variable tous les 5 ans (Indexé Madad)</option>
            <option value="fixeTzamoud">Taux Fixe (Indexé Madad)</option>
        </select>
    </div>

    <div class="result-box">
        <span id="lblRes">Mensualité estimée :</span><br>
        <div class="price-tag" id="monthlyRes">0 ₪</div>
    </div>

    <div id="formulaDetail" class="formula-info">
        </div>

    <div class="card" style="margin-top:20px;">
        <h3 id="lblBankComp">Comparatif Taux Bancaires 2026</h3>
        <table id="bankTable"></table>
    </div>
</div>

<script>
    let lang = 'he';
    const formulas = {
        prime: { rate: 5.5, fr: "Basé sur le taux de la Banque d'Israël. Pas d'amende de remboursement anticipé.", he: "מבוסס על ריבית בנק ישראל. אין עמלת פירעון מוקדם בכלל." },
        kalatz: { rate: 5.1, fr: "Le taux ne change jamais. Sécurité totale, mensualité garantie.", he: "ריבית קבועה לא צמודה (קל\"צ). ביטחון מלא, ההחזר לא משתנה לעולם." },
        variable5: { rate: 3.2, fr: "Taux révisé tous les 5 ans. Indexé à l'inflation (Madad).", he: "משתנה כל 5 שנים. צמוד למדד המחירים לצרכן." },
        fixeTzamoud: { rate: 3.5, fr: "Taux fixe mais capital indexé à l'inflation. Risqué sur le long terme.", he: "ריבית קבועה צמודה למדד. הקרן עלולה לעלות אם המדד עולה." }
    };

    const bankTaux = {
        mizrahi: { name: "Mizrahi", r: "4.8% - 5.2%", o: "9.5%" },
        leumi: { name: "Leumi", r: "5.0% - 5.4%", o: "10.0%" },
        discount: { name: "Discount", r: "4.9% - 5.3%", o: "8.5%" }
    };

    const i18n = {
        fr: {
            title: "Simulateur de Formules (Masloulim)", loan: "Montant du prêt souhaité (₪)", years: "Durée du prêt (Années)",
            formula: "Choisir la formule de crédit (Masloul) :", res: "Mensualité estimée :", 
            bank: "Comparatif Taux Bancaires 2026", thRate: "Taux Mashkanta", thOver: "Découvert", btn: "עברית"
        },
        he: {
            title: "סימולטור מסלולי משכנתא", loan: "סכום ההלוואה המבוקש (₪)", years: "תקופת ההלוואה (שנים)",
            formula: "בחר מסלול הלוואה:", res: "החזר חודשי משוער:",
            bank: "השוואת ריביות בנקים 2026", thRate: "ריבית משכנתא", thOver: "אוברדרפט", btn: "Français"
        }
    };

    function toggleLang() {
        lang = lang === 'fr' ? 'he' : 'fr';
        document.body.className = lang === 'he' ? 'rtl' : 'ltr';
        document.body.dir = lang === 'he' ? 'rtl' : 'ltr';
        updateUI();
    }

    function updateUI() {
        const t = i18n[lang];
        document.getElementById('txtTitle').innerText = t.title;
        document.getElementById('lblLoan').innerText = t.loan;
        document.getElementById('lblYears').innerText = t.years;
        document.getElementById('lblFormula').innerText = t.formula;
        document.getElementById('lblRes').innerText = t.res;
        document.getElementById('lblBankComp').innerText = t.bank;
        document.getElementById('btnLang').innerText = t.btn;
        calculate();
    }

    function calculate() {
        const cap = parseFloat(document.getElementById('loanAmount').value) || 0;
        const yr = parseFloat(document.getElementById('years').value) || 0;
        const fKey = document.getElementById('formulaSelect').value;
        const f = formulas[fKey];

        if (cap > 0 && yr > 0) {
            const r = (f.rate / 100) / 12;
            const n = yr * 12;
            const m = cap * (r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
            document.getElementById('monthlyRes').innerText = Math.round(m).toLocaleString() + " ₪";
        }
        
        document.getElementById('formulaDetail').innerHTML = `<b>${f.rate}% (Est.)</b><br>${f[lang]}`;
        
        const t = i18n[lang];
        let bHtml = `<tr><th>Banque</th><th>${t.thRate}</th><th>${t.thOver}</th></tr>`;
        for (let k in bankTaux) {
            bHtml += `<tr><td>${bankTaux[k].name}</td><td>${bankTaux[k].r}</td><td>${bankTaux[k].o}</td></tr>`;
        }
        document.getElementById('bankTable').innerHTML = bHtml;
    }

    updateUI();
</script>
</body>
</html>
